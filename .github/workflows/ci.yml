name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql
                  coverage: none

            - run: npm ci
            - run: npm run check
